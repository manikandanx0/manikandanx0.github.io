<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>halftone mosaic — mockup</title>
<style>
  :root {
    --bg: #0A0A0A;
    --text: #EDEDED;
    --red: #E8291C;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: monospace;
    height: 100%;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }
  #mosaic {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .label {
    position: absolute;
    bottom: 24px;
    left: 24px;
    font-size: 12px;
    opacity: 0.6;
    z-index: 2;
  }
</style>
</head>
<body>

<div class="stage">
  <canvas id="mosaic"></canvas>
  <div class="label" id="grid-label"></div>
</div>

<script>
(function () {
  const canvas = document.getElementById('mosaic');
  const ctx = canvas.getContext('2d');
  const stage = canvas.parentElement;

  const COLS = 180;
  const ROWS = 108;

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let width, height, cellW, cellH;
  let running = false;
  let lastFrameTime = 0;
  const FRAME_INTERVAL = 1000 / 30; // cap at 30fps
  let t = 0;

  // --- pre-render glow sprites once, reuse via drawImage (cheap) instead of
  // building a radial gradient fresh for every cell every frame (expensive) ---
  function makeGlowSprite(rgb, size) {
    const s = document.createElement('canvas');
    s.width = s.height = size;
    const sctx = s.getContext('2d');
    const grad = sctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grad.addColorStop(0, `rgba(${rgb}, 1)`);
    grad.addColorStop(0.4, `rgba(${rgb}, 0.55)`);
    grad.addColorStop(1, `rgba(${rgb}, 0)`);
    sctx.fillStyle = grad;
    sctx.fillRect(0, 0, size, size);
    return s;
  }

  const SPRITE_SIZE = 32;
  const whiteSprite = makeGlowSprite('237, 237, 237', SPRITE_SIZE);

  function resize() {
    const rect = stage.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cellW = width / COLS;
    cellH = height / ROWS;
  }

  function fakeNoise(x, y, time) {
    const v =
      Math.sin(x * 0.18 + time * 0.6) * 0.5 +
      Math.sin(y * 0.15 - time * 0.4) * 0.5 +
      Math.sin((x + y) * 0.1 + time * 0.3) * 0.5;
    const n = (v + 1.5) / 3;
    return Math.pow(n, 1.6); // more contrast: pushes mid-tones down, keeps peaks bright
  }

  // one pass of the mosaic at a given depth: coarser + dimmer + slower = feels farther back
  function drawLayer(cols, rows, speedMul, alphaMul, sizeMul) {
    const lw = width / cols;
    const lh = height / rows;

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const nx = (col / cols) * 50;
        const ny = (row / rows) * 30;
        const n = fakeNoise(nx, ny, t * speedMul);

        if (n < 0.12) continue;

        const sprite = whiteSprite;
        const size = Math.min(lw, lh) * 1.9 * n * sizeMul;
        const x = col * lw + lw / 2 - size / 2;
        const y = row * lh + lh / 2 - size / 2;

        ctx.globalAlpha = Math.min(n * alphaMul, 1);
        ctx.drawImage(sprite, x, y, size, size);
      }
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);
    // back layer: coarser grid, slower drift, dimmer — reads as "farther away"
    drawLayer(Math.round(COLS * 0.55), Math.round(ROWS * 0.55), 0.55, 0.5, 1.3);
    // front layer: full density, normal speed, full brightness
    drawLayer(COLS, ROWS, 1, 1, 1);
  }

  function loop(now) {
    if (!running) return;
    if (now - lastFrameTime >= FRAME_INTERVAL) {
      t += 0.02;
      draw();
      lastFrameTime = now;
    }
    requestAnimationFrame(loop);
  }

  function start() {
    if (running) return;
    running = true;
    requestAnimationFrame(loop);
  }

  function stop() {
    running = false;
  }

  // pause when off-screen
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting && !prefersReducedMotion) {
        start();
      } else {
        stop();
      }
    });
  });

  // pause when tab hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stop();
    } else if (!prefersReducedMotion) {
      start();
    }
  });

  window.addEventListener('resize', resize);

  resize();

  document.getElementById('grid-label').textContent =
    COLS + '×' + ROWS + ' grid · canvas · ~30fps capped · pauses off-screen';

  if (prefersReducedMotion) {
    draw(); // one static frame, no animation
  } else {
    observer.observe(stage);
  }
})();
</script>

</body>
</html>
